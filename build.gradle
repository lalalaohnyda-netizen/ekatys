plugins {
    id 'fabric-loom' version '1.5-SNAPSHOT'
    id 'maven-publish'
}

// Устанавливаем Java 8 для TLauncher
sourceCompatibility = JavaVersion.VERSION_1_8
targetCompatibility = JavaVersion.VERSION_1_8

archivesBaseName = "ekatys"
version = "1.0.0"
group = "com.example"

repositories {
    maven { url "https://maven.fabricmc.net/" }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:1.16.5"
    mappings "net.fabricmc:yarn:1.16.5+build.1:v2"
    modImplementation "net.fabricmc:fabric-loader:0.15.11"
    
    // ИСПРАВЛЕНО: убрали .5 в конце версии
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.36.0+1.16"
}

tasks.withType(JavaCompile).configureEach {
    // Принудительная компиляция под 8-ку
    it.options.release = 8
}
