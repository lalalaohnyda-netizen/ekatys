plugins {
    id 'fabric-loom' version '1.5-SNAPSHOT' // ВОТ ОНО! Без net.fabricmc!
    id 'maven-publish'
}

sourceCompatibility = JavaVersion.VERSION_16
targetCompatibility = JavaVersion.VERSION_16

archivesBaseName = "ekatys"
version = "1.0.0"
group = "com.example"

dependencies {
    // Ядро и Маппинги
    minecraft "com.mojang:minecraft:1.16.5"
    mappings "net.fabricmc:yarn:1.16.5+build.1:v2"
    
    // Используем современный лоадер (0.15.11) — он совместим с 1.16.5
    modImplementation "net.fabricmc:fabric-loader:0.15.11"
    
    // API именно для 1.16.5
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.36.0+1.16"
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 16
}
