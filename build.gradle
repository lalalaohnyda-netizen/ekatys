buildscript {
    repositories {
        maven { url "https://maven.fabricmc.net/" }
        mavenCentral()
    }
    dependencies {
        // Используем 0.10.73, так как она стабильнее снапшотов
        classpath "net.fabricmc:fabric-loom:0.10.73"
    }
}

// Пробуем альтернативный ID плагина, который точно есть в 0.10.73
apply plugin: "fabric-loom" 
apply plugin: "maven-publish"

sourceCompatibility = JavaVersion.VERSION_17
targetCompatibility = JavaVersion.VERSION_17

archivesBaseName = "ekatys"
version = "1.0.0"
group = "com.example"

repositories {
    maven { url "https://maven.fabricmc.net/" }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:1.16.5"
    mappings "net.fabricmc:yarn:1.16.5+build.1:v2"
    modImplementation "net.fabricmc:fabric-loader:0.11.3"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.36.0+1.16.5"
}

// Это чтобы майнкрафт 1.16.5 понимал скомпиленный код
tasks.withType(JavaCompile).configureEach {
    it.options.release = 16
}

// Настройка миксинов (чтобы не ругалось при сборке)
loom {
    accessWidenerPath = null // Если у тебя нет access widener
}
